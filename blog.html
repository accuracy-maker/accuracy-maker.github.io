<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Haitao Gao</title>
    <!-- bump ?v= whenever blog.css changes, to bust the browser cache -->
    <link rel="stylesheet" href="blog.css?v=3">
</head>
<body>

    <!-- Navigation -->
    <div class="nav-bar">
        <a href="index.html">home</a> /
        <a href="research.html">research</a> /
        <a href="teaching.html">teaching</a> /
        <a href="blog.html">blog</a>
    </div>
    <hr class="rule">

    <h1 class="page-title">Blog</h1>
    <p class="page-subtitle">Notes on mathematics, algorithms, and robotics.</p>

    <!-- ══════════════════════════════════════════════════════════════
         BLOG INDEX  —  built automatically from the .md files.

         To add a post:
           1. copy posts/_template.md to posts/<slug>.md
           2. fill in the title / date / excerpt at the top, write the body
           3. add "<slug>" to the top of posts/posts.json

         Nothing else to edit — the title, date and excerpt below come
         straight from each post's front matter.
    ═══════════════════════════════════════════════════════════════ -->
    <ul class="post-list" id="post-list"></ul>

    <hr class="rule">
    <div class="footer">Last updated August 2026</div>

    <script src="posts/markdown.js"></script>
    <script>
    (async function () {
        var list = document.getElementById('post-list');

        function fail(msg) {
            list.innerHTML = '<li>' + msg + '</li>';
        }

        var slugs;
        try {
            var res = await fetch('posts/posts.json');
            if (!res.ok) throw new Error(res.status);
            slugs = await res.json();
        } catch (e) {
            return fail('Could not load <code>posts/posts.json</code>. If you are ' +
                        'opening this file directly from disk, run a local server ' +
                        'instead (<code>python3 -m http.server</code>).');
        }

        var posts = await Promise.all(slugs.map(async function (slug) {
            try {
                var r = await fetch('posts/' + slug + '.md');
                if (!r.ok) throw new Error(r.status);
                var meta = MD.splitFrontMatter(await r.text()).meta;
                return { slug: slug, meta: meta };
            } catch (e) {
                return null;
            }
        }));

        var html = posts.filter(Boolean).map(function (p) {
            var li = document.createElement('li');

            var a = document.createElement('a');
            a.className = 'post-link';
            a.href = 'posts/post.html?p=' + encodeURIComponent(p.slug);
            a.textContent = p.meta.title || p.slug;
            li.appendChild(a);

            var meta = MD.formatMeta(p.meta);
            if (meta) {
                var d = document.createElement('div');
                d.className = 'post-date';
                d.textContent = meta;
                li.appendChild(d);
            }
            if (p.meta.excerpt) {
                var e = document.createElement('div');
                e.className = 'post-excerpt';
                e.textContent = p.meta.excerpt;
                li.appendChild(e);
            }
            return li;
        });

        if (!html.length) return fail('No posts yet.');
        html.forEach(function (li) { list.appendChild(li); });
    })();
    </script>

</body>
</html>
