<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O(2) as two disjoint circles</title>
<style>
  :root {
    --bg: #000000;
    --panel: #0e0e10;
    --line: #2a2a2e;
    --fg: #e8e6e1;
    --dim: #8d8b85;
    --rot: #2fbf90;
    --ref: #e8703f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 0.25rem; letter-spacing: 0.01em; }
  .sub { color: var(--dim); font-size: 14px; margin: 0 0 2rem; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  svg { display: block; width: 100%; height: auto; touch-action: none; cursor: grab; }
  svg text { font-family: inherit; }
  .t  { font-size: 14px; fill: var(--fg); }
  .ts { font-size: 12px; fill: var(--dim); }
  .th { font-size: 14px; font-weight: 500; }
  .controls { display: flex; align-items: center; gap: 12px; margin-top: 0.75rem; font-size: 13px; color: var(--dim); }
  button {
    min-width: 84px; padding: 7px 12px; font: inherit; font-size: 13px;
    color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  button:hover { background: #17171a; }
  button:active { transform: scale(0.98); }
  input[type=range] { flex: 1; accent-color: var(--rot); height: 4px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.25rem; margin-top: 1.25rem; }
  .cap { font-size: 13px; color: var(--dim); margin-bottom: 0.75rem; }
  .track { position: relative; height: 26px; }
  .rail { position: absolute; top: 12px; left: 0; right: 0; height: 2px; background: var(--line); }
  .tick { position: absolute; top: 6px; width: 1px; height: 14px; background: var(--line); }
  .knob { position: absolute; top: 6px; width: 14px; height: 14px; border-radius: 50%; margin-left: -7px; transition: left 0.05s linear; }
  .scale { display: flex; justify-content: space-between; font-size: 12px; color: #6b6963; margin-top: 4px; }
  .msg { font-size: 13px; color: var(--dim); margin-top: 0.9rem; }
  .legend { display: flex; gap: 20px; font-size: 13px; margin-top: 1rem; flex-wrap: wrap; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
  @media (prefers-reduced-motion: reduce) { .knob { transition: none; } }
</style>
</head>
<body>
<div class="wrap">

  <h1>O(2) is two disjoint circles</h1>
  <p class="sub">
    Projected to three dimensions by <span class="mono">x = a</span>, <span class="mono">y = (b&minus;c)/2</span>,
    <span class="mono">z = (b+c)/2</span>. The discarded coordinate <span class="mono">d</span> becomes the timeline below.
    Drag the scene to rotate it.
  </p>

  <svg id="sc" viewBox="0 0 680 400" role="img" aria-label="Two unit circles in orthogonal planes through the origin: the rotation branch in the xy-plane and the reflection branch in the xz-plane.">
    <g id="g"></g>
  </svg>

  <div class="controls">
    <button id="pl" aria-label="Play or pause the animation">Play</button>
    <span>&theta;</span>
    <input type="range" id="th" min="0" max="360" step="1" value="20" aria-label="Angle theta in degrees">
    <span id="tl" class="mono" style="min-width:46px;text-align:right">20&deg;</span>
  </div>

  <div class="legend">
    <span><span class="swatch" style="background:var(--rot)"></span>rotations, det = +1</span>
    <span><span class="swatch" style="background:var(--ref)"></span>reflections, det = &minus;1</span>
  </div>

  <div class="panel">
    <div class="cap">The discarded coordinate <span class="mono">d</span></div>
    <div class="track">
      <div class="rail"></div>
      <div class="tick" style="left:0"></div>
      <div class="tick" style="left:50%"></div>
      <div class="tick" style="right:0"></div>
      <div class="knob" id="da" style="background:var(--rot)"></div>
      <div class="knob" id="db" style="background:var(--ref)"></div>
    </div>
    <div class="scale"><span>&minus;1</span><span>0</span><span>+1</span></div>
    <div class="msg" id="msg"></div>
  </div>

</div>

<script>
(function () {
  var yaw = 0.62, pit = 0.42, S = 112, CX = 340, CY = 196;
  var drag = null, playing = false, th = 20, timer = null;
  var sl = document.getElementById('th'),
      tlab = document.getElementById('tl'),
      g = document.getElementById('g'),
      sc = document.getElementById('sc');

  function P(v) {
    var ca = Math.cos(yaw), sa = Math.sin(yaw), cb = Math.cos(pit), sb = Math.sin(pit);
    var x1 = v[0] * ca - v[1] * sa, y1 = v[0] * sa + v[1] * ca, z1 = v[2];
    return [CX + S * x1, CY - S * (z1 * cb - y1 * sb)];
  }
  function A(t) { return [Math.cos(t), Math.sin(t), 0]; }
  function B(t) { return [Math.cos(t), 0, Math.sin(t)]; }

  function poly(f) {
    var d = '', p;
    for (var i = 0; i <= 72; i++) {
      p = P(f(i * Math.PI / 36));
      d += (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
    }
    return d + 'Z';
  }
  function axis(v, lab) {
    var a = P([-v[0] * 1.45, -v[1] * 1.45, -v[2] * 1.45]),
        b = P([v[0] * 1.45, v[1] * 1.45, v[2] * 1.45]),
        l = P([v[0] * 1.64, v[1] * 1.64, v[2] * 1.64]);
    return '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) +
           '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) +
           '" stroke="#3a3a3f" stroke-width="1"/>' +
           '<text class="ts" x="' + l[0].toFixed(1) + '" y="' + (l[1] + 4).toFixed(1) +
           '" text-anchor="middle">' + lab + '</text>';
  }
  function dot(p, c, r) {
    return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + r + '" fill="' + c + '"/>';
  }

  function render() {
    var t = th * Math.PI / 180, s = '';
    s += axis([1, 0, 0], 'x = a') + axis([0, 1, 0], 'y = (b\u2212c)/2') + axis([0, 0, 1], 'z = (b+c)/2');

    var x1 = P([1, 0, 0]), x2 = P([-1, 0, 0]);
    s += '<circle cx="' + x1[0].toFixed(1) + '" cy="' + x1[1].toFixed(1) + '" r="7" fill="none" stroke="#5c5a55" stroke-width="1" stroke-dasharray="2 2"/>';
    s += '<circle cx="' + x2[0].toFixed(1) + '" cy="' + x2[1].toFixed(1) + '" r="7" fill="none" stroke="#5c5a55" stroke-width="1" stroke-dasharray="2 2"/>';

    s += '<path d="' + poly(A) + '" fill="none" stroke="#2fbf90" stroke-width="2.5"/>';
    s += '<path d="' + poly(B) + '" fill="none" stroke="#e8703f" stroke-width="2.5"/>';
    s += dot(P([0, 0, 0]), '#8d8b85', 2.5);
    s += dot(P(A(t)), '#2fbf90', 7) + dot(P(B(t)), '#e8703f', 7);
    s += '<text class="ts" x="640" y="30" text-anchor="end">drag to rotate</text>';
    g.innerHTML = s;

    var dA = Math.cos(t), dB = -Math.cos(t);
    document.getElementById('da').style.left = ((dA + 1) / 2 * 100) + '%';
    document.getElementById('db').style.left = ((dB + 1) / 2 * 100) + '%';

    document.getElementById('msg').textContent = Math.abs(Math.sin(t)) < 0.18
      ? 'The markers sit on the same point of the shadow \u2014 but d = ' + dA.toFixed(2) +
        ' and d = ' + dB.toFixed(2) + '. In \u211D\u2074 they are ' + Math.abs(dA - dB).toFixed(2) + ' apart.'
      : 'd = ' + dA.toFixed(2) + ' on the rotation branch, d = ' + dB.toFixed(2) + ' on the reflection branch.';

    tlab.textContent = th + '\u00B0';
  }

  sl.addEventListener('input', function () { th = +sl.value; render(); });

  document.getElementById('pl').addEventListener('click', function () {
    playing = !playing;
    this.textContent = playing ? 'Pause' : 'Play';
    if (playing) {
      timer = setInterval(function () { th = (th + 1) % 361; sl.value = th; render(); }, 34);
    } else {
      clearInterval(timer);
    }
  });

  sc.addEventListener('pointerdown', function (e) {
    drag = [e.clientX, e.clientY];
    sc.setPointerCapture(e.pointerId);
    sc.style.cursor = 'grabbing';
  });
  sc.addEventListener('pointermove', function (e) {
    if (!drag) return;
    yaw += (e.clientX - drag[0]) * 0.01;
    pit = Math.max(-1.4, Math.min(1.4, pit + (e.clientY - drag[1]) * 0.01));
    drag = [e.clientX, e.clientY];
    render();
  });
  sc.addEventListener('pointerup', function () { drag = null; sc.style.cursor = 'grab'; });

  render();
})();
</script>
</body>
</html>
